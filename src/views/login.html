<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>메뉴판 어드민 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body class="admin">
    <main class="login">
      <p class="admin-eyebrow">Excel-Driven Menu Board · Admin</p>
      <h1 class="admin-title">어드민 로그인</h1>
      <form method="post" action="/admin/login" class="login-form">
        <label class="field"><span>아이디</span><input name="username" autocomplete="username" required /></label>
        <label class="field"><span>비밀번호</span><input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="login-error" role="alert">{{error}}</p>
        <button type="submit" class="save-button">로그인</button>
      </form>
    </main>
  </body>
</html>
